<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EPUB.js Mobile Example</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
  <script src="https://unpkg.com/epubjs/dist/epub.min.js"></script>

  <link rel="stylesheet" type="text/css" href="mobile.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

</head>

<body>
  <div id="app">
    <div id="header">
      <button id="tocBtn">
        <span class="material-symbols-rounded header-icon">menu</span>
      </button>

      <div id="header-text">
        <div id="book-meta">
          <span id="book-title"></span>
          <span id="book-author"></span>
        </div>
        <h1 id="chapter_title"></h1>
      </div>

      <button id="settingsBtn" aria-label="Open settings">
        <span class="material-symbols-rounded header-icon">settings</span>
      </button>

      <button id="homeBtn" aria-label="Go to library">
        <span class="material-symbols-rounded header-icon">home</span>
      </button>
    </div>

    <button id="centerToggle"></button>

    <div id="tocPanel">
      <ul id="toc"></ul>
    </div>

    <div id="settingsPanel" aria-label="Settings controls">
      <div class="panel-section">
        <div class="panel-title">Font size</div>
        <div class="settings-controls">
          <button id="fontSizeMinus" class="settings-btn" aria-label="Decrease font size">−</button>
          <div id="fontSizeValue" class="settings-value">18px</div>
          <button id="fontSizePlus" class="settings-btn" aria-label="Increase font size">+</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-title">Line height</div>
        <div class="settings-controls">
          <button id="lineHeightMinus" class="settings-btn" aria-label="Decrease line height">−</button>
          <div id="lineHeightValue" class="settings-value">1.5</div>
          <button id="lineHeightPlus" class="settings-btn" aria-label="Increase line height">+</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-title">Paragraph spacing</div>
        <div class="settings-controls">
          <button id="paragraphSpacingMinus" class="settings-btn" aria-label="Decrease paragraph spacing">−</button>
          <div id="paragraphSpacingValue" class="settings-value">0.4em</div>
          <button id="paragraphSpacingPlus" class="settings-btn" aria-label="Increase paragraph spacing">+</button>
        </div>
      </div>

      <button id="settingsResetBtn" class="settings-reset-btn" type="button">Reset</button>
    </div>

    <div id="viewer" class="mobile"></div>
    <!-- <a id="prev" href="#prev" class="arrow">‹</a>
    <a id="next" href="#next" class="arrow">›</a> -->

    <div id="prev" class="arrow">‹</div>
    <div id="next" class="arrow">›</div>

    <div id="footer">
      <div id="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
      <div id="page-counter">
        <span id="current-page">0</span> / <span id="total-pages">0</span>
      </div>
    </div>

  </div>
  <script>
    var params = URLSearchParams && new URLSearchParams(document.location.search.substring(1));
    var url = params && params.get("url") && decodeURIComponent(params.get("url"));
    var currentSectionIndex = (params && params.get("loc")) ? params.get("loc") : undefined;

    // Load default from GitHub-hosted examples if no url param is provided.
    // var book = ePub(url || "https://archive.org/download/TheMartian_201808/The%20Martian.epub");
    var defaultBookUrl = "https://raw.githubusercontent.com/ValeEspinozaF/epub.js/master/examples/_books/artemis.epub";
    var book = ePub(url || defaultBookUrl);
    var rendition = book.renderTo("viewer", {
      width: "100%",
      height: "100%",
      spread: "none"
    });

    book.loaded.metadata.then(function(meta){
      document.getElementById("book-title").textContent = meta.title + " - ";
      document.getElementById("book-author").textContent = meta.creator;
    });


    rendition.themes.default({
      "*": {
        "font-family": "Arial, sans-serif !important",
        "font-size": "inherit !important",
        "line-height": "inherit !important",
        "font-weight": "normal !important"
      },
    
      "html": {
        "font-size": "18px !important"
      },
    
      "body": {
        "font-size": "1rem !important",
        "line-height": "1.5 !important"
      },

      "p, div, h1, h2, h3, h4, h5, h6, li": {
        "margin-top": "0.4em !important",
        "margin-bottom": "0.4em !important"
      }
    });

    // Force consistent typography even when a book ships aggressive internal CSS.
    rendition.themes.font("Arial, sans-serif");
    rendition.themes.override("font-weight", "normal", true);

    var currentFontSize = 18;
    var currentLineHeight = 1.5;
    var currentParagraphSpacing = 0.4;
    var fontSizeValueEl = document.getElementById("fontSizeValue");
    var lineHeightValueEl = document.getElementById("lineHeightValue");
    var paragraphSpacingValueEl = document.getElementById("paragraphSpacingValue");

    function applyFontSize(size) {
      currentFontSize = size;
      rendition.themes.override("font-size", currentFontSize + "px", true);
      if (fontSizeValueEl) {
        fontSizeValueEl.textContent = currentFontSize + "px";
      }
    }

    function applyLineHeight(value) {
      currentLineHeight = value;
      rendition.themes.override("line-height", currentLineHeight.toFixed(1), true);
      if (lineHeightValueEl) {
        lineHeightValueEl.textContent = currentLineHeight.toFixed(1);
      }
    }

    function applyParagraphSpacing(value) {
      currentParagraphSpacing = value;
      var spacingCss = "p, div, h1, h2, h3, h4, h5, h6, li { margin-top: " + currentParagraphSpacing.toFixed(1) + "em !important; margin-bottom: " + currentParagraphSpacing.toFixed(1) + "em !important; }";
      rendition.themes.registerCss("paragraph-spacing", spacingCss);
      rendition.themes.select("paragraph-spacing");
      if (paragraphSpacingValueEl) {
        paragraphSpacingValueEl.textContent = currentParagraphSpacing.toFixed(1) + "em";
      }
    }

    applyFontSize(currentFontSize);
    applyLineHeight(currentLineHeight);
    applyParagraphSpacing(currentParagraphSpacing);

    var tocBtn = document.getElementById("tocBtn");
    var settingsBtn = document.getElementById("settingsBtn");
    var homeBtn = document.getElementById("homeBtn");
    var tocPanel = document.getElementById("tocPanel");
    var settingsPanel = document.getElementById("settingsPanel");
    var fontSizeMinusBtn = document.getElementById("fontSizeMinus");
    var fontSizePlusBtn = document.getElementById("fontSizePlus");
    var lineHeightMinusBtn = document.getElementById("lineHeightMinus");
    var lineHeightPlusBtn = document.getElementById("lineHeightPlus");
    var paragraphSpacingMinusBtn = document.getElementById("paragraphSpacingMinus");
    var paragraphSpacingPlusBtn = document.getElementById("paragraphSpacingPlus");
    var settingsResetBtn = document.getElementById("settingsResetBtn");

    if (homeBtn) {
      homeBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        window.location.href = "index.html";
      });
    }

    if (settingsBtn && settingsPanel) {
      settingsBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        settingsPanel.classList.toggle("open");
        if (tocPanel) {
          tocPanel.classList.remove("open");
        }
      });
    }

    if (fontSizeMinusBtn) {
      fontSizeMinusBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        applyFontSize(Math.max(12, currentFontSize - 1));
      });
    }

    if (fontSizePlusBtn) {
      fontSizePlusBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        applyFontSize(Math.min(28, currentFontSize + 1));
      });
    }

    if (lineHeightMinusBtn) {
      lineHeightMinusBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        applyLineHeight(Math.max(1.0, currentLineHeight - 0.1));
      });
    }

    if (lineHeightPlusBtn) {
      lineHeightPlusBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        applyLineHeight(Math.min(2.0, currentLineHeight + 0.1));
      });
    }

    if (paragraphSpacingMinusBtn) {
      paragraphSpacingMinusBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        applyParagraphSpacing(Math.max(0.0, currentParagraphSpacing - 0.1));
      });
    }

    if (paragraphSpacingPlusBtn) {
      paragraphSpacingPlusBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        applyParagraphSpacing(Math.min(1.5, currentParagraphSpacing + 0.1));
      });
    }

    if (settingsResetBtn) {
      settingsResetBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        applyFontSize(18);
        applyLineHeight(1.5);
        applyParagraphSpacing(0.4);
      });
    }

    if (tocBtn && tocPanel) {
      tocBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        tocPanel.classList.toggle("open");
        if (settingsPanel) {
          settingsPanel.classList.remove("open");
        }
      });

      tocPanel.addEventListener("click", function(e) {
        e.stopPropagation();
      });

      tocPanel.addEventListener("touchmove", function(e) {
        e.stopPropagation();
      });
    }

    document.addEventListener("click", function(e) {
      var clickedInsideToc = tocPanel && tocPanel.contains(e.target);
      var clickedInsideSettings = settingsPanel && settingsPanel.contains(e.target);
      var clickedSettingsBtn = settingsBtn && settingsBtn.contains(e.target);
      var clickedTocBtn = tocBtn && tocBtn.contains(e.target);

      if (!clickedInsideToc && !clickedInsideSettings && !clickedSettingsBtn && !clickedTocBtn) {
        if (tocPanel) {
          tocPanel.classList.remove("open");
        }
        if (settingsPanel) {
          settingsPanel.classList.remove("open");
        }
      }
    });


    function tocIsOpen() {
      return document.getElementById("tocPanel").classList.contains("open");
    }


    rendition.display(currentSectionIndex);

    book.ready.then(function() {

      var next = document.getElementById("next");
      next.addEventListener("click", function(e){
        if (tocIsOpen()) return;
        book.package.metadata.direction === "rtl" ? rendition.prev() : rendition.next();
        e.preventDefault();
      }, false);

      var prev = document.getElementById("prev");
      prev.addEventListener("click", function(e){
        if (tocIsOpen()) return;
        book.package.metadata.direction === "rtl" ? rendition.next() : rendition.prev();
        e.preventDefault();
      }, false);


      var keyListener = function(e){

        if (tocIsOpen()) return;

        // Left Key
        if ((e.keyCode || e.which) == 37) {
          book.package.metadata.direction === "rtl" ? rendition.next() : rendition.prev();
        }

        // Right Key
        if ((e.keyCode || e.which) == 39) {
          book.package.metadata.direction === "rtl" ? rendition.prev() : rendition.next();
        }

      };

      rendition.on("keyup", keyListener);
      document.addEventListener("keyup", keyListener, false);

      // Generate locations for progress tracking
      book.locations.generate().then(function() {
        console.log("Locations generated:", book.locations.length());
      });

    })


    rendition.on("rendered", function(section){
      var current = getCurrentNavItem(section.href);

      if (current) {

        var titleEl = document.getElementById("chapter_title");
        if (titleEl) {
          titleEl.textContent = current.label;
        }
      }

      var items = document.querySelectorAll("#toc li");
      items.forEach(li => li.classList.remove("active"));

      if (current) {
        items.forEach(li => {
          if (li.textContent === current.label) {
            li.classList.add("active");
          }
        });
      }
    });


    rendition.on("relocated", function(location){
      console.log(location);

      var next = book.package.metadata.direction === "rtl" ?  document.getElementById("prev") : document.getElementById("next");
      var prev = book.package.metadata.direction === "rtl" ?  document.getElementById("next") : document.getElementById("prev");

      if (location.atEnd) {
        next.style.visibility = "hidden";
      } else {
        next.style.visibility = "visible";
      }

      if (location.atStart) {
        prev.style.visibility = "hidden";
      } else {
        prev.style.visibility = "visible";
      }

      // Update progress bar and page counter
      if (location && location.start) {
        var percentage = location.start.percentage || 0;

        // Use percentage for progress bar (works immediately)
        var progressBar = document.getElementById("progress-bar");
        if (progressBar) {
          progressBar.style.width = (percentage * 100) + "%";
        }

        var currentPageEl = document.getElementById("current-page");
        var totalPagesEl = document.getElementById("total-pages");
        var displayed = location.start.displayed;

        if (currentPageEl && totalPagesEl) {
          // Display real rendered pages for the current section.
          if (displayed && displayed.total > 0) {
            currentPageEl.textContent = displayed.page;
            totalPagesEl.textContent = displayed.total;
          } else {
            currentPageEl.textContent = "-";
            totalPagesEl.textContent = "-";
          }
        }
      }
    });


    rendition.on("layout", function(layout) {
      let viewer = document.getElementById("viewer");

      if (layout.spread) {
        viewer.classList.remove('single');
      } else {
        viewer.classList.add('single');
      }
    });

    window.addEventListener("unload", function () {
      console.log("unloading");
      this.book.destroy();
    });

    function resolveChapterTarget(href) {
      if (!href) {
        return href;
      }

      // Most books resolve directly from nav href.
      if (book.spine.get(href)) {
        return href;
      }

      // Some books have nav hrefs relative to the nav document directory.
      var navPath = book.packaging && book.packaging.navPath;
      if (navPath) {
        var navDirIndex = navPath.lastIndexOf("/");
        var navDir = navDirIndex > -1 ? navPath.slice(0, navDirIndex + 1) : "";
        var relHref = href.replace(/^\.\//, "").replace(/^\/+/, "");
        var resolvedHref = navDir + relHref;

        if (book.spine.get(resolvedHref)) {
          return resolvedHref;
        }
      }

      return href;
    }

    function getCurrentNavItem(sectionHref) {
      if (!book.navigation || !sectionHref) {
        return null;
      }

      var current = book.navigation.get(sectionHref);
      if (current) {
        return current;
      }

      var navPath = book.packaging && book.packaging.navPath;
      if (!navPath) {
        return null;
      }

      var navDirIndex = navPath.lastIndexOf("/");
      var navDir = navDirIndex > -1 ? navPath.slice(0, navDirIndex + 1) : "";

      if (sectionHref.indexOf(navDir) === 0) {
        current = book.navigation.get(sectionHref.slice(navDir.length));
        if (current) {
          return current;
        }
      }

      return book.navigation.get(navDir + sectionHref) || null;
    }


    book.loaded.navigation.then(function(toc){

      var select = document.getElementById("toc");

			toc.forEach(function(chapter) {

        var li = document.createElement("li");
        li.textContent = chapter.label;

        li.addEventListener("click", function(e) {
          e.stopPropagation();
          var target = resolveChapterTarget(chapter.href);
          rendition.display(target).catch(function(err) {
            console.warn("Unable to display chapter target:", chapter.href, "->", target, err);
          });
          document.getElementById("tocPanel").classList.remove("open");
        });

        select.appendChild(li);
			});
		});

    let arrowTimeout;

    function showArrows(e) {
      if (tocIsOpen()) return;

      const arrows = document.querySelectorAll(".arrow");
      arrows.forEach(a => a.classList.remove("hidden"));

      clearTimeout(arrowTimeout);

      arrowTimeout = setTimeout(() => {
        arrows.forEach(a => a.classList.add("hidden"));
      }, 2000); // 2 seconds
    } 


    function toggleHeader() {
      document.getElementById("app").classList.toggle("hide-header");

      // Header visibility changes available reading height; force repagination.
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          var viewer = document.getElementById("viewer");
          if (viewer) {
            rendition.resize(viewer.clientWidth, viewer.clientHeight);
          } else {
            rendition.resize();
          }
        });
      });
    }

    document.getElementById("centerToggle").addEventListener("click", function(e) {
      e.stopPropagation();
      toggleHeader();
    });


    showArrows({ target: document.body });

  </script>

</body>
</html>
