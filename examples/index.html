<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EPUB.js Mobile Library</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
  <script src="https://unpkg.com/epubjs/dist/epub.min.js"></script>
  <style>
    :root {
      --bg: #fafafa;
      --ink: #333;
      --muted: #777;
      --card: #ffffff;
      --edge: #ddd;
      --edge-2: #ebebeb;
      --accent: #bebebe;
      --accent-2: #999;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .hero {
      padding: 28px 24px 14px;
      border-bottom: 1px solid var(--edge);
      background: var(--bg);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(1.5rem, 1.2rem + 2vw, 2.2rem);
      letter-spacing: 0.01em;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.45;
    }

    .content {
      padding: 18px 24px 24px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      color: var(--muted);
    }

    select,
    button {
      width: 100%;
      border-radius: 10px;
      font-size: 1rem;
    }

    select {
      padding: 12px;
      border: 1px solid var(--edge);
      background: #fff;
      color: var(--ink);
    }

    button {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: var(--accent-2);
      border-color: var(--accent-2);
    }

    button:disabled {
      cursor: not-allowed;
      background: var(--edge-2);
      border-color: var(--edge);
      color: #9b9b9b;
    }

    .quick-list {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .quick-link {
      text-decoration: none;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--edge);
      border-radius: 8px;
      padding: 10px;
      transition: background-color 0.12s ease, border-color 0.12s ease;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }

    .quick-link:hover {
      background: var(--bg);
      border-color: var(--accent-2);
    }

    .quick-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--edge);
      background: #f5f5f5;
      display: block;
    }

    .folder-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 6px;
      border: 1px solid var(--edge);
      background: #f5f5f5;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
      overflow: hidden;
    }

    .folder-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .folder-cell {
      width: 100%;
      height: 100%;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      display: block;
      background-color: #f5f5f5;
    }

    /* Better scaling on small screens */
    @media (max-width: 520px) {
      .quick-list {
        grid-template-columns: repeat(2, 1fr);
      }

      .folder-cover {
        gap: 1px;
      }
    }

    .quick-cover-fallback {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 6px;
      border: 1px solid var(--edge);
      background: #f5f5f5;
      color: #9b9b9b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .quick-title {
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      line-height: 1.3;
      min-height: 2.2em;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1>Mobile EPUB Library</h1>
      <p>Choose a book from the GitHub repository examples/_books folder and open it directly in the mobile reader.</p>
    </header>

    <section class="content">
      <label for="book-picker">Choose an ebook</label>
      <select id="book-picker" aria-label="Choose an ebook"></select>
      <button id="open-mobile" type="button">Open in Mobile Reader</button>

      <div id="quick-list" class="quick-list" aria-label="Quick launch links"></div>
      <p class="hint">Target page: mobile.html?url=_books/...</p>
    </section>
  </main>

  <script>
    (async function () {
      var picker = document.getElementById("book-picker");
      var openMobile = document.getElementById("open-mobile");
      var quickList = document.getElementById("quick-list");
      var hint = document.querySelector(".hint");

      function buildTarget(path) {
        return "mobile.html?url=" + encodeURIComponent(path);
      }

      function formatLabel(meta, fileName) {
        var title = meta && meta.title ? String(meta.title).trim() : "";
        var creator = meta && meta.creator ? String(meta.creator).trim() : "";

        if (title && creator) {
          return title + " - " + creator;
        }

        if (title) {
          return title;
        }

        return fileName;
      }

      async function loadBookEntry(fileInfo) {
        var fileName = fileInfo.fileName;
        var path = fileInfo.path;
        var label = fileName;
        var title = fileName;
        var coverUrl = "";

        if (typeof ePub === "function") {
          var book = ePub(path);
          try {
            var meta = await book.loaded.metadata;
            label = formatLabel(meta, fileName);
            title = meta && meta.title ? String(meta.title).trim() : fileName;
            if (!title) {
              title = fileName;
            }
            try {
              coverUrl = await book.coverUrl();
            } catch (coverError) {
              coverUrl = "";
            }
          } catch (error) {
            label = fileName;
            title = fileName;
          } finally {
            try {
              book.destroy();
            } catch (destroyError) {
              // Ignore cleanup errors from incomplete loads.
            }
          }
        }

        return {
          fileName: fileName,
          path: path,
          label: label,
          title: title,
          coverUrl: coverUrl
        };
      }

      function renderNoBooks(message) {
        picker.innerHTML = "";
        quickList.innerHTML = "";
        openMobile.disabled = true;

        var option = document.createElement("option");
        option.value = "";
        option.textContent = "No readable ebooks found in _books";
        picker.appendChild(option);

        if (hint) {
          hint.textContent = message;
        }
      }

      async function discoverBookFiles() {
        // Try local manifest first
        try {
          var localResp = await fetch('./_books/manifest.json');
          if (localResp.ok) {
            var localItems = await localResp.json();
            if (Array.isArray(localItems)) {
              return localItems;
            }
          }
        } catch (e) {
          // ignore and fall back
        }

        // fallback to GitHub listing
        var GITHUB_BOOKS_API = "https://api.github.com/repos/ValeEspinozaF/epub.js/contents/examples/_books?ref=master";
        var response = await fetch(GITHUB_BOOKS_API, {
          headers: {
            "Accept": "application/vnd.github+json"
          }
        });

        if (!response.ok) {
          throw new Error("Cannot read GitHub _books contents");
        }

        var items = await response.json();
        if (!Array.isArray(items)) {
          throw new Error("Unexpected GitHub response shape");
        }

        return items
          .filter(function (item) {
            return item &&
              item.type === "file" &&
              /\.(epub|opf)$/i.test(item.name) &&
              typeof item.download_url === "string";
          })
          .sort(function (a, b) {
            return a.name.localeCompare(b.name);
          })
          .map(function (item) {
            return {
              type: 'file',
              name: item.name,
              path: item.download_url
            };
          });
      }

      var topEntries = [];
      var currentFolderName = null;
      try {
        topEntries = await discoverBookFiles();
      } catch (error) {
        renderNoBooks("Could not load books from _books.");
        return;
      }

      if (!topEntries.length) {
        renderNoBooks("No ebooks found in examples/_books.");
        return;
      }

      openMobile.disabled = false;

      if (hint) {
        hint.textContent = "Found " + topEntries.length + " items in examples/_books.";
      }

      async function renderEntries(entries) {
        quickList.innerHTML = '';
        picker.innerHTML = '';

        // Update hint based on context
        if (currentFolderName) {
          if (hint) hint.textContent = 'Found ' + entries.length + ' items in examples/_books/' + currentFolderName + '.';
        } else {
          if (hint) hint.textContent = 'Found ' + entries.length + ' items in examples/_books.';
        }

        // If viewing a folder, show a back tile
        if (currentFolderName) {
          var backLink = document.createElement('a');
          backLink.className = 'quick-link';
          backLink.href = '#';
          var backCover = document.createElement('div');
          backCover.className = 'quick-cover-fallback';
          backCover.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
          backLink.appendChild(backCover);
          var backTitle = document.createElement('div');
          backTitle.className = 'quick-title';
          backTitle.textContent = 'Back to library';
          backLink.appendChild(backTitle);
          backLink.addEventListener('click', function (e) {
            e.preventDefault();
            currentFolderName = null;
            renderEntries(topEntries);
          });
          quickList.appendChild(backLink);
        }

        for (const item of entries) {
          if (!item) continue;

          if (item.type === 'file') {
            const entry = await loadBookEntry({ fileName: item.name, path: item.path });

            var option = document.createElement('option');
            option.value = entry.path;
            option.textContent = entry.label;
            picker.appendChild(option);

            var quick = document.createElement('a');
            quick.className = 'quick-link';
            quick.href = buildTarget(entry.path);

            if (entry.coverUrl) {
              var cover = document.createElement('img');
              cover.className = 'quick-cover';
              cover.src = entry.coverUrl;
              cover.alt = entry.title + ' cover';
              quick.appendChild(cover);
            } else {
              var fallback = document.createElement('div');
              fallback.className = 'quick-cover-fallback';
              fallback.textContent = 'No cover';
              quick.appendChild(fallback);
            }

            var quickTitle = document.createElement('div');
            quickTitle.className = 'quick-title';
            quickTitle.textContent = entry.title;
            quick.appendChild(quickTitle);

            quickList.appendChild(quick);
          } else if (item.type === 'dir') {
            var quick = document.createElement('a');
            quick.className = 'quick-link';
            quick.href = '#';

            // try to load up to 4 covers from the inner files (manifest)
            var covers = [];
            if (Array.isArray(item.files) && item.files.length) {
              for (var j = 0; j < Math.min(4, item.files.length); j++) {
                try {
                  var f = item.files[j];
                  var bi = await loadBookEntry({ fileName: f.name, path: './' + f.path });
                  covers.push(bi.coverUrl || null);
                } catch (err) {
                  covers.push(null);
                }
              }
            }

            if (covers.length) {
              var folderCover = document.createElement('div');
              folderCover.className = 'folder-cover';
              for (var k = 0; k < 4; k++) {
                var cell = document.createElement('div');
                cell.className = 'folder-cell';
                if (covers[k]) {
                  cell.style.backgroundImage = 'url("' + covers[k] + '")';
                }
                folderCover.appendChild(cell);
              }
              quick.appendChild(folderCover);
            } else {
              var fallback = document.createElement('div');
              fallback.className = 'quick-cover-fallback';
              fallback.textContent = 'Folder';
              quick.appendChild(fallback);
            }

            var quickTitle = document.createElement('div');
            quickTitle.className = 'quick-title';
            quickTitle.textContent = item.name;
            quick.appendChild(quickTitle);

            quick.addEventListener('click', function (e) {
              e.preventDefault();
              if (Array.isArray(item.files) && item.files.length) {
                currentFolderName = item.name;
                const inner = item.files.map(function (f) { return { type: 'file', name: f.name, path: './' + f.path }; });
                renderEntries(inner);
              } else {
                if (hint) hint.textContent = 'Folder is empty or cannot be read.';
              }
            });

            quickList.appendChild(quick);
          }
        }
      }

      // initial render
      renderEntries(topEntries);

      function openSelectedBook() {
        var selectedPath = picker.value;
        window.location.href = buildTarget(selectedPath);
      }

      openMobile.addEventListener('click', openSelectedBook);
      picker.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          openSelectedBook();
        }
      });
    })();
  </script>
</body>
</html>
